<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formule de politesse</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root {
      --fond: #ffffff;
      --texte: #1f2933;
      --discret: #5b6770;
      --trait: #d5dbe0;
      --accent: #0b6e69;
      --accent-texte: #ffffff;
      --apercu: #f3f6f6;
      --erreur: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #1c2124;
        --texte: #e6ebee;
        --discret: #9aa7b0;
        --trait: #3a444a;
        --accent: #4fc3bb;
        --accent-texte: #0d2624;
        --apercu: #242b2f;
        --erreur: #ffb4ab;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--fond);
      color: var(--texte);
      font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
    label, legend { display: block; font-weight: 600; margin-bottom: 6px; }
    fieldset { border: 0; padding: 0; margin: 14px 0; }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--trait);
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    input[type="text"]:focus-visible,
    button:focus-visible,
    .choix input:focus-visible + span {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .note { min-height: 1.4em; margin: 6px 0 0; color: var(--discret); font-size: 12.5px; }
    .choix { display: flex; border: 1px solid var(--trait); border-radius: 4px; overflow: hidden; }
    .choix label { flex: 1; margin: 0; font-weight: 400; cursor: pointer; }
    .choix input { position: absolute; opacity: 0; }
    .choix span { display: block; padding: 8px 10px; text-align: center; }
    .choix label + label span { border-left: 1px solid var(--trait); }
    .choix input:checked + span { background: var(--accent); color: var(--accent-texte); font-weight: 600; }
    .apercu {
      margin: 0 0 14px;
      padding: 10px 12px;
      background: var(--apercu);
      border-left: 3px solid var(--accent);
      white-space: pre-line;
      min-height: 5.5em;
    }
    button.principal {
      width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-texte);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.principal:disabled { opacity: .5; cursor: default; }
    button.lien {
      border: 0; background: none; padding: 0; margin-top: 4px;
      color: var(--accent); font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer;
    }
    .statut { min-height: 1.4em; margin: 8px 0 0; font-size: 12.5px; color: var(--discret); }
    .statut.erreur { color: var(--erreur); }
    .titre-apercu { font-weight: 600; margin: 0 0 6px; }
  </style>
</head>
<body>
  <h1>Formule de politesse</h1>

  <label for="prenoms">Prénom du destinataire</label>
  <input type="text" id="prenoms" autocomplete="off">
  <p class="note" id="note" aria-live="polite"></p>
  <button type="button" class="lien" id="reinit" hidden>Reprendre le prénom du destinataire</button>

  <fieldset>
    <legend>Formule de politesse</legend>
    <div class="choix">
      <label><input type="radio" name="formule" value="Bien à toi" checked><span>Bien à toi</span></label>
      <label><input type="radio" name="formule" value="Bien à vous"><span>Bien à vous</span></label>
    </div>
  </fieldset>

  <p class="titre-apercu">Aperçu</p>
  <div class="apercu" id="apercu" aria-live="polite"></div>

  <button type="button" class="principal" id="inserer">Insérer dans le message</button>
  <p class="statut" id="statut" role="status"></p>

  <script src="taskpane.js"></script>
</body>
</html>
